<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Circular Arc for Upper Text (Starts at 8:30, sweeps to 3:30) -->
    <path
      id="curvedTextPath"
      d="M 58 300 A 202 202 0 0 1 250 48 A 202 202 0 0 1 442 300"
      fill="none"
    />

    <style>
      .bg-circle { fill: #0d1321; }
      .ring-outer { stroke: #22304a; stroke-width: 3; fill: none; }
      .ring-inner { stroke: #ffffff; stroke-width: 1; stroke-opacity: 0.25; fill: none; }
      .ring-guide { stroke: #ffffff; stroke-width: 0.75; stroke-opacity: 0.15; fill: none; }
      
      .arc-text {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 13.8px;
        font-weight: 700;
        fill: #ffffff;
        letter-spacing: 0.125em;
      }

      .text-dot {
        fill: #ffffff;
      }
      
      .hex-outline {
        stroke: #ffffff;
        stroke-width: 2.2;
        fill: none;
        stroke-linejoin: round;
        stroke-opacity: 0.9;
      }

      .hex-secondary {
        stroke: #ffffff;
        stroke-width: 1;
        stroke-opacity: 0.25;
        fill: none;
        stroke-linejoin: round;
      }

      .letter-solid {
        fill: #ffffff;
      }

      .letter-wire {
        fill: none;
        stroke: #ffffff;
        stroke-width: 3.2;
        stroke-linejoin: round;
        stroke-linecap: round;
      }

      .letter-wire-inner {
        fill: none;
        stroke: #ffffff;
        stroke-width: 1.6;
        stroke-opacity: 0.75;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
    </style>
  </defs>

  <!-- 1. Deep Midnight Navy Emblem Background (#0d1321) -->
  <circle cx="250" cy="250" r="246" class="bg-circle" />

  <!-- 2. Concentric Decorative Line Rings -->
  <circle cx="250" cy="250" r="244" class="ring-outer" />
  <circle cx="250" cy="250" r="226" class="ring-inner" />
  <circle cx="250" cy="250" r="168" class="ring-guide" />

  <!-- 3. Circular Text along Arc (Dead-Center over 12 o'clock with white dots) -->
  <text class="arc-text">
    <textPath href="#curvedTextPath" startOffset="20.2%">
      <tspan class="text-dot">●</tspan> CENTER OF EXCELLENCE FOR AI AND ROBOTICS <tspan class="text-dot">●</tspan>
    </textPath>
  </text>

  <!-- 4. Center Hexagon Wireframe -->
  <g id="hexagon">
    <!-- Primary Outer Hexagon in Crisp White Wireframe -->
    <polygon
      points="250,117 375,189 375,334 250,407 125,334 125,189"
      class="hex-outline"
    />

    <!-- Secondary Hexagon for Technical CAD Feel -->
    <polygon
      points="250,110 382,185 382,339 250,414 118,339 118,185"
      class="hex-secondary"
    />

    <!-- Center Spine Line -->
    <line x1="250" y1="117" x2="250" y2="143" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.8" />
    <line x1="250" y1="381" x2="250" y2="407" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.8" />
  </g>

  <!-- 5. 3D Converging Perspective CEAR Letters -->
  <g id="letters">
    <!-- ===== LETTER C ===== (Solid White) -->
    <path
      d="
        M 184 176
        L 152 194
        L 140 212
        L 140 312
        L 152 330
        L 184 348
        L 184 316
        L 164 304
        L 158 294
        L 158 230
        L 164 220
        L 184 208
        Z
      "
      class="letter-solid"
    />

    <!-- ===== LETTER E ===== (Solid White) -->
    <path
      d="
        M 242 143
        L 194 170
        L 194 354
        L 242 381
        L 242 349
        L 214 333
        L 214 280
        L 236 280
        L 236 250
        L 214 250
        L 214 197
        L 242 181
        Z
      "
      class="letter-solid"
    />

    <!-- ===== LETTER A ===== (White Outline with CAD wireframe) -->
    <path
      d="
        M 282 156
        L 258 170
        L 258 381
        L 274 372
        L 274 300
        L 290 291
        L 290 363
        L 306 354
        L 306 170
        Z
      "
      class="letter-wire"
    />
    <polygon
      points="282,185 272,250 292,240"
      class="letter-wire"
    />
    <path
      d="
        M 282 170
        L 266 180
        L 266 366
      "
      class="letter-wire-inner"
    />
    <path
      d="
        M 282 170
        L 298 180
        L 298 348
      "
      class="letter-wire-inner"
    />

    <!-- ===== LETTER R ===== (White Outline with CAD wireframe) -->
    <path
      d="
        M 316 176
        L 348 194
        L 360 210
        L 360 252
        L 348 266
        L 360 323
        L 342 333
        L 332 276
        L 332 339
        L 316 348
        Z
      "
      class="letter-wire"
    />
    <path
      d="
        M 332 203
        L 342 209
        L 346 220
        L 346 236
        L 342 245
        L 332 240
        Z
      "
      class="letter-wire"
    />
    <line x1="324" y1="184" x2="324" y2="340" class="letter-wire-inner" />
    <path d="M 336 280 L 348 320" class="letter-wire-inner" />
  </g>
</svg>